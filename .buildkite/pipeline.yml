agents:
  useVault: true
  image: "docker.io/library/node:18"

steps:

  - label: Validate TokenPolicy RREs
    command: "/agent/check-catalog-info.sh"
    agents:
      image: "docker.elastic.co/ci-agent-images/pipelib:0.35.0@sha256:4e521947861821d7607b26b95c141f47e6a8794c6b15e53b1813dafea61a557b"
    if_changed:
      - "catalog-info.yaml"

  - label: "Pre-commit"
    key: "pre-commit"
    command: "echo all good!"
    plugins:
      - elastic/hermit#v1.0.2
      - elastic/pre-commit#v1.0.3
    agents:
      image: "docker.elastic.co/ci-agent-images/python-buildkite-agent"

  - label: ":wave: Crawling GitHub issues"
    command: "crawl.sh"
    env:
      ES_CLUSTER_INFO_VAULT_PATH: "secret/ci/elastic-issue-crawler/github-stats-user"
      GITHUB_OAUTH_APP_VAULT_PATH: "secret/ci/elastic-issue-crawler/github_oauth_app"
